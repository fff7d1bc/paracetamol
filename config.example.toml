# Paracetamol host configuration. Command-line flags override corresponding
# environment variables where defined; both override these values.

[storage]
# Choose an absolute persistent-data path, or omit this key for the XDG default.
# data_dir = "/mnt/ai/paracetamol"

[gateway]
# Empty lists keep automatic backend and render-node discovery.
# Loopback is always available; a non-loopback listen address adds publication.
applications = []
profile = "auto"
render_nodes = []
listen = "127.0.0.1"
port = 7455
startup_timeout = "30m"
# Optional Bearer authentication. Use a private file containing a random key.
# api_key_file = "/absolute/path/to/gateway.key"

[gateway.client]
url = "http://127.0.0.1:7455/v1"
# Client credentials are separate, including for a local gateway.
# api_key_file = "/absolute/path/to/gateway.key"

[gateway.llama-cpp]
backend = "rocm"
models_max = 1
