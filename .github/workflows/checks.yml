name: checks

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pi-extensions:
    name: Managed Pi extensions
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.22.1'
          package-manager-cache: false
      - name: Install locked runtime without lifecycle scripts
        run: |
          mkdir -p build/pi-tests
          cp agent-clients/pi/package.json agent-clients/pi/package-lock.json build/pi-tests/
          npm ci --prefix build/pi-tests --cache build/npm-cache --ignore-scripts --no-audit --no-fund
      - name: Test managed extensions without external services
        run: make test-pi PI_RUNTIME="$PWD/build/pi-tests"

  tier-1:
    name: Go 1.26 and container resources
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Check and test Go control plane
        run: |
          make check
          make test
          make static

      - name: Compile retained Python resources
        run: PYTHONPYCACHEPREFIX=/tmp/paracetamol-pycache python3 -m compileall -q applications containers evaluations tests

      - name: Check shell syntax
        run: |
          bash -n paracetamol bin/paracetamol bin/pi bin/maki \
            applications/comfyui/entrypoint.sh \
            applications/llama-cpp/entrypoint.sh \
            applications/dwarfstar/entrypoint.sh

      - name: Validate catalog JSON
        run: |
          find catalog -type f -name '*.json' -print0 |
            xargs -0 -n1 python3 -m json.tool >/dev/null

      - name: Exercise dependency-free CLI
        run: |
          ./paracetamol --version
          ./paracetamol content list
          ./paracetamol content install comfyui image \
            --dry-run \
            --non-interactive \
            --accept-license \
            --acknowledge-license-risk
          ./paracetamol content install all \
            --dry-run \
            --non-interactive \
            --accept-license \
            --acknowledge-license-risk
